# Test profile: use an in-memory H2 database instead of PostgreSQL.
# Flyway migrations are skipped; Hibernate creates the schema from the entities.
spring.datasource.url=jdbc:h2:mem:speisegeist;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=test-secret-test-secret-test-secret
jwt.expiration=86400
openrouter.api.key=test-key
openrouter.api.base-url=https://openrouter.ai/api/v1
openrouter.api.timeout-seconds=30
openrouter.model=test-model
spring.web.cors.allowed-origins=http://localhost:4200
app.version=test
