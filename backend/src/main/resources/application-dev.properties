# Development Profile
# Laeuft lokal (Host) gegen PostgreSQL im Docker-Container (docker compose up -d postgres).
# Credentials/Secrets kommen aus der .env, damit lokal und Docker identisch sind.
spring.config.import=optional:file:${user.dir}/.env[.properties],optional:file:${user.dir}/../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/speisegeist
spring.datasource.username=speisegeist
spring.datasource.password=speisegeist

# JWT (muss >= 32 Byte / 256 bit sein, sonst wirft HS256 WeakKeyException)
jwt.secret=${JWT_SECRET:dev-secret-key-for-testing-only-0123456789}

# OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY:}

# Logging Development
logging.level.com.philipphofmann=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Show SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
