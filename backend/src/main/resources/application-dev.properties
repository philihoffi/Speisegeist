# Development Profile
spring.datasource.url=jdbc:postgresql://localhost:5432/speisegeist
spring.datasource.username=speisegeist
spring.datasource.password=dev123

# JWT Development (muss >= 32 Byte / 256 bit sein, sonst wirft HS256 WeakKeyException)
