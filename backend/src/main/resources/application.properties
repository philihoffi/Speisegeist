# Application
spring.application.name=speisegeist-backend
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:speisegeist}
spring.datasource.username=${DB_USER:speisegeist}
spring.datasource.password=${DB_PASSWORD:speisegeist}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# JWT
jwt.secret=${JWT_SECRET:my-secret-key-change-in-production}
jwt.expiration=86400

# OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.base-url=https://openrouter.ai/api/v1
# Modell MUSS strukturierte Ausgaben (response_format/json_schema) unterstuetzen.
# mistral-small-3.1-24b faellt hier aus: einziger Provider ist Cloudflare, dessen
# json_schema-Implementierung crasht mit HTTP 500 (finish_reason=error). Geprueft ok:
# openai/gpt-4o-mini (Provider OpenAI) und mistralai/mistral-nemo (Provider DekaLLM).
openrouter.model=openai/gpt-4o-mini
# Read-Timeout: muss groesser sein als die Generierungszeit, sonst wird der Stream gekappt (Stream cancelled).
openrouter.api.timeout-seconds=300
openrouter.api.retry-max-attempts=3
# Max. Tokens fuer die KI-Antwort. Zu niedrig => JSON abgeschnitten (finish_reason=length);
# zu hoch => Generierung kann laenger als der Timeout dauern. Ein Rezept passt locker in 2000.
openrouter.max-tokens=2000

# CORS
spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:4201
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allow-credentials=true

# Logging
logging.level.root=INFO
logging.level.com.philipphofmann=DEBUG
# Kein Security-DEBUG in Prod: wuerde Authorization-Header/Token-Details loggen (dev-Profil ueberschreibt)
logging.level.org.springframework.security=INFO
