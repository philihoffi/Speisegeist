<app-header></app-header>
<div class="users-page">
  <div class="page-header">
    <h1>Benutzerverwaltung</h1>
  </div>

  @if (loading()) {
    <app-loading-spinner />
  } @else if (error()) {
    <app-error-banner [message]="error()!" (retry)="loadUsers()" />
  } @else {
    <div class="table-wrap">
      <table mat-table [dataSource]="users()" class="mat-elevation-z2">
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>E-Mail</th>
          <td mat-cell *matCellDef="let u">{{ u.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rolle</th>
          <td mat-cell *matCellDef="let u">
            <mat-select
              [value]="u.role"
              (valueChange)="changeRole(u, $event)"
              [disabled]="submittingId() === u.id"
            >
              <mat-option value="USER">Benutzer</mat-option>
              <mat-option value="ADMIN">Admin</mat-option>
            </mat-select>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Registriert</th>
          <td mat-cell *matCellDef="let u">{{ u.createdAt | date:'dd.MM.yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="lastLogin">
          <th mat-header-cell *matHeaderCellDef>Letzter Login</th>
          <td mat-cell *matCellDef="let u">{{ u.lastLogin ? (u.lastLogin | date:'dd.MM.yyyy HH:mm') : '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Aktionen</th>
          <td mat-cell *matCellDef="let u">
            <button
              mat-icon-button
              color="warn"
              (click)="deleteUser(u)"
              [disabled]="submittingId() === u.id"
              aria-label="Benutzer löschen"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  }
</div>
