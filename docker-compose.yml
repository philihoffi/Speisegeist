services:
  postgres:
    image: postgres:17
    container_name: speisegeist-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-speisegeist}
      POSTGRES_USER: ${DB_USER:-speisegeist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-speisegeist}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-speisegeist} -d ${DB_NAME:-speisegeist}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - speisegeist

  backend:
    build: ./backend
    container_name: speisegeist-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-speisegeist}
      DB_USER: ${DB_USER:-speisegeist}
      DB_PASSWORD: ${DB_PASSWORD:-speisegeist}
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SPRING_WEB_CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://localhost"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - speisegeist

  frontend:
    build: ./frontend
    container_name: speisegeist-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - speisegeist

volumes:
  postgres-data:

networks:
  speisegeist:
    driver: bridge
